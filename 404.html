<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Page not found - Fix My Photo Dates Timeline">
  <meta name="robots" content="noindex">
  <meta name="robots" content="noindex,follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <title>Page Not Found - Fix My Photo Dates</title>

  <style>
    :root {
      --accent-600: #D97706;
      --accent-500: #F59E0B;
      --slate-900: #0F172A;
      --slate-800: #1E293B;
      --text-primary: #1E293B;
      --text-secondary: #64748B;
      --bg-white: #FFFFFF;

      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      color: var(--text-primary);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --text-primary: #F1F5F9;
        --text-secondary: #CBD5E1;
        --bg-white: #0F172A;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --text-primary: #F1F5F9;
      --text-secondary: #CBD5E1;
      --bg-white: #0F172A;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg-white);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }

    .error-code {
      font-size: 6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #D97706, #F59E0B);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
      line-height: 1;
    }

    h1 {
      font-size: 2rem;
      margin: 1rem 0 0.5rem 0;
      font-weight: 700;
    }

    p {
      font-size: 1.125rem;
      color: var(--text-secondary);
      margin: 1rem 0 2rem 0;
    }

    .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    a {
      display: inline-block;
      padding: 0.875rem 1.75rem;
      background: linear-gradient(135deg, #D97706, #F59E0B);
      color: white;
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
    }

    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(217, 119, 6, 0.4);
    }

    .suggestions {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--slate-800);
      text-align: left;
    }

    .suggestions h2 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 1rem;
    }

    .suggestions ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .suggestions li {
      margin-bottom: 0.75rem;
    }

    .suggestions a {
      display: inline;
      padding: 0;
      background: none;
      color: var(--accent-600);
      box-shadow: none;
      text-decoration: underline;
    }

    .suggestions a:hover {
      color: var(--accent-500);
      transform: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📸</div>
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>Sorry! The page you're looking for doesn't exist or has moved.</p>

    <a href="./">Back to Home</a>

    <div class="suggestions">
      <h2>Looking for something?</h2>
      <ul>
        <li><a href="./">Homepage</a> - Features and overview</li>
        <li><a href="product.html">How It Works</a> - Technical details</li>
        <li><a href="faq.html">FAQ</a> - Common questions</li>
      </ul>
    </div>
  </div>
</body>
</html>
